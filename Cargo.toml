[package]
name = "llm_adapter"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
async-trait = "0.1"
eventsource-stream = "0.2"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[features]
# Run integration tests that hit real provider APIs.
# Disabled by default; requires `*_API_KEY` env vars (e.g. via .env).
#   cargo test --features integration
integration = []
