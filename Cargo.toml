[package]
name = "llm_adapter"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
async-trait = "0.1"
eventsource-stream = "0.2"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"

# Latency clocks: std::time::Instant panics on wasm32 (no clock source in
# wasm32-unknown-unknown); web-time uses performance.now() there. Gated so
# native users don't carry the extra dep.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[dev-dependencies]
bytes = "1"
h2 = "0.4"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "io-util", "time"] }
wiremock = "0.6"

[features]
# Run integration tests that hit real provider APIs.
# Disabled by default; requires `*_API_KEY` env vars (e.g. via .env).
#   cargo test --features integration
integration = []
